name: Deploy JR-Ecom Application

on:
  push:
    branches:
      - main

jobs:
  deploy-ravelis:
    name: Deploy to Ravelis Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --ignore-platform-reqs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Package Release Zip Archive
        run: |
          zip -q -r release.zip . -x ".git/*" ".github/*" "node_modules/*" ".env*" "tests/*" "storage/framework/cache/*" "storage/framework/sessions/*" "storage/framework/views/*" "storage/logs/*"

      - name: Upload Setup Script via FTP (Fallback)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.RAVELIS_FTP_HOST }}
          username: ${{ secrets.RAVELIS_FTP_USER }}
          password: ${{ secrets.RAVELIS_FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./public/
          exclude: |
            **/*
            !setup.php

      - name: Deploy Release Bundle via HTTPS POST (Fast & Reliable)
        run: |
          RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -F "token=ravelis_deploy_secret_987654321" \
            -F "package=@release.zip" \
            "https://ravelis.online/setup.php")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Server Response Status: $HTTP_STATUS"
          echo "Server Response Body: $HTTP_BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Deployment failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
