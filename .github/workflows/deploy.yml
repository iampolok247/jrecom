name: Deploy JR-Ecom Application

on:
  push:
    branches:
      - main

jobs:
  deploy-ravelis:
    name: Deploy to Ravelis Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Prepare Single Fast Release Bundle
        run: |
          mkdir -p deploy-dist
          zip -r deploy-dist/release.zip . -x ".git/*" ".github/*" "node_modules/*" ".env*" "deploy-dist/*"
          cp public/setup.php deploy-dist/setup.php

      - name: Deploy Release Bundle via FTP (10-Second Upload)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.RAVELIS_FTP_HOST }}
          username: ${{ secrets.RAVELIS_FTP_USER }}
          password: ${{ secrets.RAVELIS_FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./deploy-dist/
          timeout: 180000

      - name: Trigger Automatic Extraction & Setup
        run: |
          curl -s -L "https://ravelis.online/setup.php" || true
