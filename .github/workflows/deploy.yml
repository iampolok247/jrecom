name: Deploy JR-Ecom Application

on:
  push:
    branches:
      - main

jobs:
  deploy-ravelis:
    name: Deploy to Ravelis Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install PHP Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Package Vendor Archive for Fast Upload
        run: zip -r vendor.zip vendor/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Deploy to Ravelis via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.RAVELIS_FTP_HOST }}
          username: ${{ secrets.RAVELIS_FTP_USER }}
          password: ${{ secrets.RAVELIS_FTP_PASS }}
          port: 21
          protocol: ftp
          timeout: 190000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.env
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/node_modules/**
            **/vendor/**
